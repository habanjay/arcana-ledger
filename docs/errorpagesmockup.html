<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Trading Error States</title>
	<style>
		:root { --bg:#211b30; --panel:#3b344b; --deep:#302941; --line:rgba(215,205,235,.25); --muted:#9c91b8; --text:#f8f5ff; --cyan:#43b8ff; --green:#16d99b; --red:#ff4d6d; --amber:#ffb632; }
		* { box-sizing:border-box; } body { margin:0; min-width:320px; color:var(--text); background:var(--bg); font:12px/1.4 "Segoe UI",Tahoma,sans-serif; } button,input { font:inherit; } button { border:0; color:inherit; cursor:pointer; }
		button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
		.app { display:flex; min-height:100vh; overflow:hidden; } .rail { width:67px; flex:0 0 67px; border-right:1px solid rgba(255,255,255,.12); display:flex; flex-direction:column; align-items:center; padding:21px 11px 18px; }
		.brand { width:31px; height:31px; margin:0 auto 42px; position:relative; } .brand::before,.brand::after { content:""; position:absolute; width:24px; height:18px; transform:skewY(-29deg); } .brand::before { top:0; left:0; background:#f05db8; } .brand::after { right:0; bottom:0; background:#a96be9; }
		.nav { display:grid; gap:13px; width:100%; } .nav button,.logout { width:43px; height:42px; margin:auto; border-radius:10px; background:transparent; color:#a69ab9; font-size:19px; transition:.2s ease; } .nav button:hover,.nav button.active { color:#fff; background:#3b304e; } .logout { margin-top:auto; font-size:18px; }
		.workspace { flex:1; min-width:0; padding:0 20px 24px; } .topbar { height:74px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px; } .back { width:29px; height:29px; border-radius:50%; background:var(--deep); color:#bcb0d2; font-size:22px; line-height:25px; } .page-title { text-align:center; font-weight:700; font-size:10px; } .top-actions { justify-self:end; display:flex; align-items:center; gap:17px; }
		.search { width:149px; height:32px; display:flex; align-items:center; padding:0 10px 0 13px; border-radius:11px; background:var(--deep); color:#bcb0d2; } .search input { width:100%; border:0; outline:0; color:#fff; background:transparent; font-size:10px; } .search span { font-size:18px; line-height:1; } .icon-button { width:34px; height:34px; border-radius:50%; border:1px solid #655a75; background:transparent; color:#ddd5e9; font-size:17px; } .avatar { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:#453b59; font-size:17px; }
		.content { max-width:1080px; margin:0 auto; } .page-heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin:0 0 18px; } h1 { margin:0; font-size:22px; line-height:1.1; } .page-heading p { margin:6px 0 0; color:var(--muted); font-size:10px; }
		.error-layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr); gap:14px; align-items:start; } .column { display:grid; gap:14px; min-width:0; } .panel { border:1px solid var(--line); border-radius:15px; background:var(--panel); overflow:hidden; }
		.error-card { min-height:430px; position:relative; display:flex; align-items:center; justify-content:center; padding:38px; text-align:center; background:linear-gradient(145deg,#2f2349,#3b344b 58%,#49334f); } .error-card::before { content:""; position:absolute; width:280px; height:280px; top:-110px; right:-65px; border:45px solid rgba(67,184,255,.16); border-radius:50%; } .error-card::after { content:""; position:absolute; width:170px; height:170px; bottom:-92px; left:-48px; border-radius:50%; background:rgba(22,217,155,.16); }
		.error-page { width:min(100% - 40px, 760px); min-height:100vh; margin:0 auto; padding:clamp(28px, 8vh, 72px) 0 32px; display:grid; align-content:center; gap:14px; }
		.error-card { border-radius:15px; }
		.error-content { position:relative; z-index:1; max-width:430px; } .error-mark { width:76px; height:76px; display:grid; place-items:center; margin:0 auto 22px; border:1px solid rgba(67,184,255,.5); border-radius:22px; background:rgba(67,184,255,.12); color:var(--cyan); font-size:34px; font-weight:700; } .error-code { margin:0; color:#e9dcff; font-size:68px; line-height:.95; letter-spacing:.02em; } .error-title { margin:17px 0 8px; font-size:20px; } .error-description { max-width:360px; margin:0 auto 23px; color:#c2b7d1; font-size:10px; }
		.actions { display:flex; justify-content:center; gap:9px; } .primary-action,.ghost { padding:9px 15px; border-radius:7px; font-weight:700; } .primary-action { background:linear-gradient(90deg,#ad65eb,#bd6ef1); } .ghost { background:var(--deep); color:#c7bdd5; }
		.panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 15px; border-bottom:1px solid rgba(215,205,235,.14); } .panel-head h2,.panel h2 { margin:0; font-size:13px; } .panel-head p { margin:3px 0 0; color:var(--muted); font-size:9px; } .panel-body { padding:15px; }
		.state-list { display:grid; gap:8px; } .state-button { display:grid; grid-template-columns:43px 1fr auto; align-items:center; gap:10px; width:100%; padding:10px; border:1px solid transparent; border-radius:8px; background:#332d43; text-align:left; } .state-button:hover,.state-button.selected { border-color:var(--cyan); background:rgba(67,184,255,.12); } .state-button strong { display:block; font-size:10px; } .state-button span { display:block; margin-top:2px; color:#9186a3; font-size:8px; } .state-code { display:grid!important; place-items:center; width:34px; height:30px; margin:0!important; border-radius:7px; background:#453b59; color:#ddd5e9!important; font-size:9px!important; font-weight:700; }
		.detail-list { display:grid; gap:10px; } .detail-row { display:flex; justify-content:space-between; gap:12px; padding-bottom:9px; border-bottom:1px solid rgba(215,205,235,.12); color:#b8adc8; font-size:9px; } .detail-row:last-child { padding-bottom:0; border-bottom:0; } .detail-row strong { color:#f0eaf7; font-size:10px; text-align:right; } .status { display:flex; align-items:center; gap:7px; color:#c8bdd5; font-size:9px; } .status i { width:7px; height:7px; border-radius:50%; background:var(--green); }
		.help { padding:18px 20px 19px; background:linear-gradient(135deg,#24194c,#61377e 62%,#a24d77); } .help p { margin:6px 0 16px; color:#d0c3dd; font-size:9px; } .help-link { display:inline-block; padding:8px 12px; border-radius:7px; background:rgba(255,255,255,.14); font-size:9px; font-weight:700; }
		@media (max-width:820px) { .error-layout { grid-template-columns:1fr; max-width:620px; margin:auto; } .error-card { min-height:390px; } }
		@media (max-width:560px) { .error-page { width:100%; padding:20px 12px 24px; gap:12px; } .error-card { min-height:360px; padding:24px 16px; } .error-code { font-size:56px; } .actions { flex-direction:column; } .actions button { width:100%; } .help { padding:16px; } }
	</style>
</head>
	<body>
		<main class="error-page" aria-label="Application error">
			<section class="panel error-card">
				<div class="error-content">
					<div class="error-mark" aria-hidden="true">!</div>
					<p class="error-code">500</p>
					<h1 class="error-title">The service hit a snag</h1>
					<p class="error-description">The request could not be completed right now. Your saved portfolio data is safe. Please try again shortly.</p>
					<div class="actions"><button class="primary-action" id="retry-action">Try again</button><button class="ghost" id="dashboard-action">Return to dashboard</button></div>
				</div>
			</section>
			<section class="panel help"><h2>Still need a hand?</h2><p>Our support team can help recover your workspace or investigate a persistent issue.</p><button class="help-link" id="support-action">Contact support</button></section>
		</main>
		<script>
			document.getElementById('retry-action').addEventListener('click', event => { event.currentTarget.textContent = 'Request sent'; setTimeout(() => event.currentTarget.textContent = 'Try again', 1200); });
			document.getElementById('dashboard-action').addEventListener('click', event => { event.currentTarget.textContent = 'Opening dashboard'; setTimeout(() => event.currentTarget.textContent = 'Return to dashboard', 1200); });
			document.getElementById('support-action').addEventListener('click', event => { event.currentTarget.textContent = 'Support request opened'; setTimeout(() => event.currentTarget.textContent = 'Contact support', 1400); });
		</script>
	</body>
</html>
